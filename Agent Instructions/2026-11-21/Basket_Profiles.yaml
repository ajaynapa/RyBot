kind: AdaptiveDialog
modelDescription: |-
  Use ONLY when the ACE asks for products for a pet: "recommend", "suggest", "what should I get", "what do I need for", "what's good for", "do we have", "looking for", or names a product type (food, treats, chews, toys, litter, beds, carriers, supplements). Includes requests that mention allergies, foods to avoid, life stage, size, breed or needs.
  Do NOT use for general pet-care or how-to questions (e.g. "travelling with my cat to the vet", "how do I trim my dog's nails", "how often should I feed my kitten"), policy or store questions, specific product lookups by name or ID, or symptom and health questions.
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent: {}
  actions:
    - kind: SearchAndSummarizeContent
      id: zMRiN0
      displayName: Get basket plan
      latencyMessageSettings:
        allowLatencyMessage: false

      autoSend: false
      variable: Topic.PlanRaw
      userInput: "=\"Basket profile for: \" & System.Activity.Text & \". Reply on ONE line with fields separated by |: profile name (the ### heading) | pet search words (pet type, age, size, breed if named, foods to avoid as chicken-free etc.) | then for each basket item: item title (the bold numbered title, e.g. Food without chicken) | item Search line. Item 1 is the category asked about. List up to 5 items in the profile's order. Never list Treat of the Month. No 'Item 1' labels. No other text.\""
      additionalInstructions:
      fileSearchDataSource:
        searchFilesMode:
          kind: SearchSpecificFiles
          files:
            - ca_agent.file.Basket_Profiles.md_PAk

      knowledgeSources:
        kind: SearchSpecificKnowledgeSources

      applyModelKnowledgeSetting: false
      responseCaptureType: FullResponse

    - kind: InvokeAIBuilderModelAction
      id: invokeAIBuilderModelAction_J3KfyF
      displayName: Make plan
      input:
        binding:
          Profile: =JSON(Topic.PlanRaw)
          Request: =System.Activity.Text

      output:
        binding:
          predictionOutput: Topic.PlanOut

      aIModelId: 51c2e7ad-cdab-40c2-afb3-c98b3376d1a6

    - kind: SetVariable
      id: setVariable_MDltu8
      displayName: Split Plan
      variable: Topic.Lines
      value: =Split(Topic.PlanOut.text, "|")

    - kind: SetMultipleVariables
      id: setVariable_LANasR
      displayName: Save plan fields
      assignments:
        - variable: Topic.ProfileName
          value: =IfError(Trim(Substitute(Index(Topic.Lines, 1).Value, "Profile:", "")), "")

        - variable: Topic.PetDetails
          value: =IfError(Trim(Index(Topic.Lines, 2).Value), "")

        - variable: Topic.Name1
          value: "=With({x: IfError(Trim(Index(Topic.Lines, 3).Value), \"\")}, If(StartsWith(x, \"Item \"), Trim(Mid(x, Find(\":\", x) + 1)), x))"

        - variable: Topic.Search1
          value: =IfError(Trim(Index(Topic.Lines, 4).Value), System.Activity.Text)

        - variable: Topic.Name2
          value: "=With({x: IfError(Trim(Index(Topic.Lines, 5).Value), \"\")}, If(StartsWith(x, \"Item \"), Trim(Mid(x, Find(\":\", x) + 1)), x))"

        - variable: Topic.Search2
          value: =IfError(Trim(Index(Topic.Lines, 6).Value), "")

        - variable: Topic.Name3
          value: "=With({x: IfError(Trim(Index(Topic.Lines, 7).Value), \"\")}, If(StartsWith(x, \"Item \"), Trim(Mid(x, Find(\":\", x) + 1)), x))"

        - variable: Topic.Search3
          value: =IfError(Trim(Index(Topic.Lines, 8).Value), "")

        - variable: Topic.Name4
          value: "=With({x: IfError(Trim(Index(Topic.Lines, 9).Value), \"\")}, If(StartsWith(x, \"Item \"), Trim(Mid(x, Find(\":\", x) + 1)), x))"

        - variable: Topic.Search4
          value: =IfError(Trim(Index(Topic.Lines, 10).Value), "")

        - variable: Topic.Name5
          value: "=With({x: IfError(Trim(Index(Topic.Lines, 11).Value), \"\")}, If(StartsWith(x, \"Item \"), Trim(Mid(x, Find(\":\", x) + 1)), x))"

        - variable: Topic.Search5
          value: =IfError(Trim(Index(Topic.Lines, 12).Value), "")

    - kind: InvokeAIBuilderModelAction
      id: invokeAIBuilderModelAction_V3pO6s
      displayName: Write intros
      input:
        binding:
          Categories: =Topic.Name1 & " | " & Topic.Name2 & " | " & Topic.Name3 & " | " & Topic.Name4 & " | " & Topic.Name5
          Profile: =Topic.ProfileName
          Request: =System.Activity.Text

      output:
        binding:
          predictionOutput: Topic.IntroOut

      aIModelId: 57a2808c-99ed-4fd8-8854-2fccfa871bdf

    - kind: SetVariable
      id: setVariable_CIgtWc
      displayName: Split intros
      variable: Topic.IntroLines
      value: =Split(Topic.IntroOut.text, "|")

    - kind: SetMultipleVariables
      id: setVariable_l307I5
      displayName: Save intros
      assignments:
        - variable: Topic.Intro
          value: =IfError(Trim(Index(Topic.IntroLines, 1).Value), "")

        - variable: Topic.CatIntro1
          value: =IfError(Trim(Index(Topic.IntroLines, 2).Value), "")

        - variable: Topic.CatIntro2
          value: =IfError(Trim(Index(Topic.IntroLines, 3).Value), "")

        - variable: Topic.CatIntro3
          value: =IfError(Trim(Index(Topic.IntroLines, 4).Value), "")

        - variable: Topic.CatIntro4
          value: =IfError(Trim(Index(Topic.IntroLines, 5).Value), "")

        - variable: Topic.CatIntro5
          value: =IfError(Trim(Index(Topic.IntroLines, 6).Value), "")

    - kind: SendActivity
      id: sendActivity_jMaaf3
      displayName: Show Profile
      activity: "{Topic.Intro & Char(10) & Char(10) & \"Profile: \" & Topic.ProfileName & Char(10) & Char(10) & \"In this basket: \" & Topic.Name1 & If(IsBlank(Topic.Name2), \"\", \" · \" & Topic.Name2) & If(IsBlank(Topic.Name3), \"\", \" · \" & Topic.Name3) & If(IsBlank(Topic.Name4), \"\", \" · \" & Topic.Name4) & If(IsBlank(Topic.Name5), \"\", \" · \" & Topic.Name5)}"

    - kind: SendActivity
      id: sendActivity_6lagBm
      displayName: Cat 1 heading
      activity: "{\"**\" & Topic.Name1 & \"**\" & Char(10) & Char(10) & Topic.CatIntro1}"

    - kind: SearchAndSummarizeContent
      id: CUIWtU
      displayName: Cat.1 search
      autoSend: false
      variable: Topic.Result1
      userInput: =System.Activity.Text
      moderationLevel: Low
      additionalInstructions: List up to 5 different products from www.petvalu.ca that match the request. For each, give the full product name, rating and review count if shown, and key features.
      fileSearchDataSource:
