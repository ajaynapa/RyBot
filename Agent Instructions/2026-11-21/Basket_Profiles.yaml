                  predictionOutput: Topic.Cards1

              aIModelId: 0ebaeea6-27e7-43bc-96e7-a6b73595c04f

            - kind: SendActivity
              id: sendActivity_N5Recx
              displayName: Cat 1 show
              activity: "{Topic.Cards1.text}"

      elseActions:
        - kind: SearchAndSummarizeContent
          id: cat1Retry
          displayName: Cat 1 retry
          autoSend: false
          variable: Topic.Result1b
          userInput: ="Pet Valu " & Topic.Name1 & " for " & Topic.PetDetails
          moderationLevel: Low
          additionalInstructions: List up to 5 different products from www.petvalu.ca that match the request. For each, give the full product name, rating and review count if shown, and key features.
          fileSearchDataSource:
            searchFilesMode:
              kind: DoNotSearchFiles

          knowledgeSources:
            kind: SearchSpecificKnowledgeSources
            knowledgeSources:
              - ca_agent.knowledge.PublicSiteSearchSource.2

          applyModelKnowledgeSetting: false
          responseCaptureType: FullResponse

        - kind: ConditionGroup
          id: cat1RetryFoundGroup
          conditions:
            - id: cat1RetryFoundItem
              condition: =!IsBlank(Topic.Result1b)
              displayName: Cat 1 retry found?
              actions:
                - kind: InvokeAIBuilderModelAction
                  id: cat1RetryFormat
                  displayName: Cat 1 retry format
                  input:
                    binding:
                      Request: =System.Activity.Text
                      Results: =JSON(Topic.Result1b)

                  output:
                    binding:
                      predictionOutput: Topic.Cards1

                  aIModelId: 0ebaeea6-27e7-43bc-96e7-a6b73595c04f

                - kind: SendActivity
                  id: cat1RetryShow
                  displayName: Cat 1 retry show
                  activity: "{Topic.Cards1.text}"

          elseActions:
            - kind: SendActivity
              id: cat1NoMatch
              displayName: Cat 1 no match
              activity: We couldn't find products for this one right now. Try searching petvalu.ca for it.

